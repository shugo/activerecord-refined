name: sqlserver-probe

# A throwaway phase-0 probe, removed once the real leg lands.  It runs on the
# draft pull request through the standing pull_request trigger, to prove out
# what local sandboxing cannot reach: that tiny_tds builds on ruby-master, and
# that the sqlserver adapter then connects to a SQL Server and runs the DSL.
on:
  pull_request:
  workflow_dispatch:

jobs:
  sqlserver-probe:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Str0ng_Passw0rd!"
        ports:
          - 1433:1433
    env:
      SQLSERVER_HOST: 127.0.0.1
      SQLSERVER_PORT: 1433
      SQLSERVER_USERNAME: sa
      SQLSERVER_PASSWORD: "Str0ng_Passw0rd!"
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: head

      - name: Install FreeTDS
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y freetds-dev freetds-bin

      - name: Build tiny_tds + the adapter and smoke the DSL
        run: |
          set -eux
          cat > /tmp/Gemfile <<'EOF'
          source "https://rubygems.org"
          gem "activerecord", "~> 8.1"
          gem "tiny_tds"
          gem "activerecord-sqlserver-adapter"
          EOF
          export BUNDLE_GEMFILE=/tmp/Gemfile
          bundle install || {
            find / -name mkmf.log -path '*tiny_tds*' -exec sh -c 'echo "== $1 =="; cat "$1"' _ {} \; 2>/dev/null
            exit 1
          }
          bundle exec ruby .github/sqlserver-probe/probe.rb
