name: test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    env:
      # Nothing here loads pg or mysql2, so skip building the extensions.
      BUNDLE_WITHOUT: db
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          # Proc#refined has not been released yet, so master is the only
          # Ruby that can run this.
          ruby-version: head
          bundler-cache: true
      - run: bundle exec rake test

  postgresql:
    runs-on: ubuntu-latest
    env:
      ADAPTER: postgresql
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: head
          bundler-cache: true
      - run: bundle exec rake test

  mysql:
    runs-on: ubuntu-latest
    env:
      ADAPTER: mysql2
      # The suite creates its own database, which MYSQL_USER would not be
      # granted; root is the account that can.
      DB_USERNAME: root
      DB_PASSWORD: root
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: head
          bundler-cache: true
      - run: bundle exec rake test
