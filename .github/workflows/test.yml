name: test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  rubocop:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: db
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          # Linting needs no Proc#refined, but bundler reads the gemspec's
          # required_ruby_version and 4.1.0.dev leaves head the only fit.
          ruby-version: head
          bundler-cache: true
      - run: bundle exec rubocop

  sqlite:
    runs-on: ubuntu-latest
    env:
      # Nothing here loads pg or mysql2, so skip building the extensions.
      BUNDLE_WITHOUT: db
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          # Proc#refined has not been released yet, so master is the only
          # Ruby that can run this.
          ruby-version: head
          bundler-cache: true
      - run: bundle exec rake test

  postgresql:
    runs-on: ubuntu-latest
    env:
      ADAPTER: postgresql
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: head
          bundler-cache: true
      - run: bundle exec rake test

  # Two servers that do not agree -- MariaDB's json column is a checked
  # longtext where MySQL's is a type of its own, and MariaDB casts to integer
  # where MySQL knows only signed -- reached through two clients, mysql2 and
  # trilogy, that want the same SQL of them.  Each server has passed while the
  # other failed, so the four combinations all run.
  mysql:
    name: mysql (${{ matrix.adapter }}, ${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [mysql2, trilogy]
        image: [mysql:8, mariadb:11]
        include:
          - image: mysql:8
            health: mysqladmin ping -proot
          - image: mariadb:11
            health: healthcheck.sh --connect --innodb_initialized
    env:
      ADAPTER: ${{ matrix.adapter }}
      # The suite creates its own database, which MYSQL_USER would not be
      # granted; root is the account that can.
      DB_USERNAME: root
      DB_PASSWORD: root
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: head
          bundler-cache: true
      - run: bundle exec rake test

  # Oracle, reached through oracle_enhanced.  The client is heavier than the
  # others -- Instant Client, and ruby-oci8 from git because its release does
  # not build on ruby-master -- so this leg installs the client itself and
  # bundles the optional oracle group by hand rather than through the cached
  # bundler-cache path.  gvenzl/oracle-free is Oracle 23ai Free.
  oracle:
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: oracle
          APP_USER: refined
          APP_USER_PASSWORD: refined
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 20s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 40s
    env:
      ADAPTER: oracle_enhanced
      DB_HOST: 127.0.0.1
      DB_PORT: 1521
      DB_DATABASE: FREEPDB1
      DB_USERNAME: refined
      DB_PASSWORD: refined
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: head
      - name: Install Oracle Instant Client
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y unzip wget
          sudo apt-get install -y libaio1t64 || sudo apt-get install -y libaio1
          # Oracle's libclntsh links libaio.so.1, but Ubuntu 24.04's t64
          # rename ships libaio.so.1t64; bridge the soname it expects.
          libdir=/usr/lib/x86_64-linux-gnu
          if [ ! -e "$libdir/libaio.so.1" ] && [ -e "$libdir/libaio.so.1t64" ]; then
            sudo ln -sf "$libdir/libaio.so.1t64" "$libdir/libaio.so.1"
          fi
          base=https://download.oracle.com/otn_software/linux/instantclient
          cd /opt
          sudo wget -q "$base/instantclient-basiclite-linuxx64.zip"
          sudo wget -q "$base/instantclient-sdk-linuxx64.zip"
          sudo unzip -q -o instantclient-basiclite-linuxx64.zip
          sudo unzip -q -o instantclient-sdk-linuxx64.zip
          ic=$(ls -d /opt/instantclient_*)
          echo "$ic" | sudo tee /etc/ld.so.conf.d/oracle-instantclient.conf
          sudo ldconfig
          echo "LD_LIBRARY_PATH=$ic" >> "$GITHUB_ENV"
      - name: Bundle the oracle group and run the suite
        run: |
          set -eux
          bundle config set --local with oracle
          bundle config set --local without db
          bundle install
          bundle exec rake test

  # Microsoft SQL Server, reached through the sqlserver adapter over tiny_tds,
  # which FreeTDS builds and which is kept in an optional bundler group, like
  # Oracle's client.  The server image has no healthcheck, so the leg waits
  # for it before the suite connects.
  sqlserver:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Str0ng_Passw0rd!"
        ports:
          - 1433:1433
    env:
      ADAPTER: sqlserver
      DB_HOST: 127.0.0.1
      DB_PORT: 1433
      DB_USERNAME: sa
      DB_PASSWORD: "Str0ng_Passw0rd!"
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: head
      - name: Install FreeTDS
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y freetds-dev freetds-bin
      - name: Bundle the sqlserver group, wait for the server, run the suite
        run: |
          set -eux
          bundle config set --local with sqlserver
          bundle config set --local without db
          bundle install
          bundle exec ruby -e 'require "tiny_tds"; 40.times { begin; TinyTds::Client.new(host: "127.0.0.1", port: 1433, username: "sa", password: ENV.fetch("DB_PASSWORD")).execute("SELECT 1").each; exit; rescue StandardError => e; warn e.message; sleep 3; end }; abort "SQL Server did not become ready"'
          bundle exec rake test
