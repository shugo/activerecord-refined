<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sandbox browser check</title>
<!-- As in index.html, and kept at the same version by bin/prepare-rb. -->
<meta name="pglite" content="https://cdn.jsdelivr.net/npm/@electric-sql/pglite@0.5.4/dist/index.js">
</head>
<body>
<pre id="out">running…</pre>

<script src="./assets/browser.umd.js"></script>
<script type="module">
// Boots the sandbox the same way index.html does and reports the outcome back
// to the dev server, so a headless browser can be used to check whether the
// JS stack there is deep enough for Active Record to compile.
const { DefaultRubyVM } = globalThis['ruby-wasm-wasi'];
const out = document.getElementById('out');

const report = (status, detail) => {
  out.textContent = `${status}\n${detail}`;
  navigator.sendBeacon('/__result', JSON.stringify({ status, detail, ua: navigator.userAgent }));
};

function rubyString(s) {
  return "'" + s.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";
}

try {
  const module = await WebAssembly.compileStreaming(fetch('./ruby.wasm'));
  const { vm } = await DefaultRubyVM(module);

  const manifest = await (await fetch('./manifest.json')).json();
  const sources = await Promise.all(
    manifest.map(async (rel) => [rel, await (await fetch(`./rb/lib/${rel}`)).text()])
  );
  vm.eval(`
    require 'fileutils'
    [
      ${sources.map(([rel, src]) => `[${rubyString(rel)}, ${rubyString(src)}]`).join(',\n')}
    ].each do |rel, src|
      path = File.join('/rb/lib', rel)
      FileUtils.mkdir_p File.dirname(path)
      File.write path, src
    end
    $LOAD_PATH.unshift '/rb/lib'
  `);

  // evalAsync, as the page does: what reaches the database has to be able to
  // wait on a promise when the database is PGlite.
  await vm.evalAsync(await (await fetch('./boot.rb')).text());

  const result = (await vm.evalAsync(`
    rel = Author.where { :age >= 50 }
    "#{RUBY_DESCRIPTION}\n#{rel.to_sql}\n#{rel.pluck(:name).inspect}"
  `)).toString();

  // And the other database, which is where the stack is deepest: every query
  // goes out to JS and comes back through asyncify.
  const [{ PGlite, types }, { createBridge }] = await Promise.all([
    import(document.querySelector('meta[name="pglite"]').content),
    import('./pglite-bridge.mjs'),
  ]);
  globalThis.pglite = createBridge({ PGlite, types });
  await vm.evalAsync("use_database('postgresql')");

  const postgres = (await vm.evalAsync(`
    rel = Author.distinct_on { :country }.order { [:country, :age.desc] }
    version = ActiveRecord::Base.connection.select_value('SELECT version()')
    "#{version[0, 40]}\n#{rel.to_sql}\n#{rel.pluck(:name).inspect}"
  `)).toString();

  report('OK', `${result}\n${postgres}`);
} catch (e) {
  report('FAILED', String(e).split('\n').slice(0, 4).join('\n'));
}
</script>
</body>
</html>
