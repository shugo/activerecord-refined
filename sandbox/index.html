<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>activerecord-refined sandbox</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1b1f24;
    --muted: #5b6470;
    --border: #d8dee6;
    --accent: #b4433a;
    --accent-weak: #fdf2f1;
    --code-bg: #1e232b;
    --code-fg: #e6e9ee;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--fg);
    background: var(--bg);
    line-height: 1.6;
  }

  header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 1rem;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.05rem; margin: 0; }
  header p { margin: 0; color: var(--muted); font-size: .85rem; }
  header a { color: var(--accent); }

  #layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: calc(100vh - 57px);
  }
  @media (max-width: 800px) {
    #layout { grid-template-columns: 1fr; height: auto; }
    #sidebar { max-height: 240px; }
  }

  #sidebar {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: .75rem 0 2rem;
  }
  #sidebar h2 {
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin: 1rem 1rem .35rem;
  }
  #sidebar button {
    display: block;
    width: 100%;
    text-align: left;
    padding: .3rem 1rem;
    border: 0;
    background: none;
    font: inherit;
    font-size: .87rem;
    cursor: pointer;
    color: var(--fg);
  }
  #sidebar button:hover { background: var(--accent-weak); }
  #sidebar button[aria-current="true"] {
    background: var(--accent-weak);
    color: var(--accent);
    font-weight: 600;
  }

  #main {
    display: grid;
    grid-template-rows: auto 1fr auto 1fr;
    min-height: 0;
    padding: 1rem 1.25rem 1.25rem;
    gap: .5rem;
  }

  .bar {
    display: flex;
    align-items: center;
    gap: .75rem;
  }
  .bar h2 { font-size: .8rem; margin: 0; color: var(--muted); font-weight: 600; }
  .bar .spacer { flex: 1; }

  button.run {
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 5px;
    padding: .35rem .9rem;
    font: inherit;
    font-size: .85rem;
    cursor: pointer;
  }
  button.run:disabled { background: #b9c0c9; cursor: default; }
  .hint { color: var(--muted); font-size: .78rem; }

  textarea, pre {
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.55;
    margin: 0;
    border-radius: 6px;
    min-height: 0;
  }

  textarea {
    width: 100%;
    padding: .7rem .8rem;
    border: 1px solid var(--border);
    resize: none;
    tab-size: 2;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  pre {
    background: var(--code-bg);
    color: var(--code-fg);
    padding: .7rem .8rem;
    overflow: auto;
    white-space: pre;
  }

  #status {
    padding: 2rem 1.25rem;
    color: var(--muted);
    font-size: .9rem;
  }
  #status strong { color: var(--fg); }
</style>
</head>
<body>

<header>
  <h1>activerecord-refined sandbox</h1>
  <p>
    Ruby 4.1, ActiveRecord and SQLite, running inside your browser.
    <a href="https://github.com/shugo/activerecord-refined" target="_blank" rel="noopener">GitHub</a>
  </p>
</header>

<div id="status">Loading Ruby… <strong id="status-detail"></strong></div>

<div id="layout" hidden>
  <nav id="sidebar"></nav>

  <div id="main">
    <div class="bar">
      <h2>Code</h2>
      <div class="spacer"></div>
      <span class="hint">Ctrl/Cmd + Enter to run</span>
      <button class="run" id="run">Run</button>
    </div>
    <textarea id="editor" spellcheck="false"></textarea>

    <div class="bar">
      <h2>Output</h2>
      <div class="spacer"></div>
      <span class="hint" id="timing"></span>
    </div>
    <pre id="output"></pre>
  </div>
</div>

<script src="./vendor/browser.umd.js"></script>
<script type="module">
import { examples } from './examples.js';

const { DefaultRubyVM } = globalThis['ruby-wasm-wasi'];

const statusEl = document.getElementById('status');
const detailEl = document.getElementById('status-detail');
const layoutEl = document.getElementById('layout');
const sidebarEl = document.getElementById('sidebar');
const editorEl = document.getElementById('editor');
const outputEl = document.getElementById('output');
const runEl = document.getElementById('run');
const timingEl = document.getElementById('timing');

let vm;

// These are a few KB each and change with every deployment, while GitHub
// Pages serves them with max-age=600.  A hard reload does not help: it
// bypasses the cache for the document and its subresources, not for what a
// script fetches afterwards.  Revalidating instead costs a 304 when nothing
// has changed.  ruby.wasm is deliberately left out of this -- it is 40 MB,
// and its own cache-control is what governs it.
const FRESH = { cache: 'no-cache' };

// Nothing under rb/lib is packed into ruby.wasm.  The sources are handed to
// Ruby, which writes them into the in-memory filesystem and puts that on
// $LOAD_PATH.  activerecord-refined cannot be packed (the rbwasm output is
// already wasi-vfs packed, and the gem's required_ruby_version keeps Bundler
// on the build host from resolving it), and this way the gem can be swapped
// without rebuilding the 64 MB binary.
async function installRubyFiles() {
  const manifest = await (await fetch('./manifest.json', FRESH)).json();
  const sources = await Promise.all(
    manifest.map(async (rel) => [rel, await (await fetch(`./rb/lib/${rel}`, FRESH)).text()])
  );

  const entries = sources
    .map(([rel, src]) => `[${rubyString(rel)}, ${rubyString(src)}]`)
    .join(',\n');

  vm.eval(`
    require 'fileutils'
    [
      ${entries}
    ].each do |rel, src|
      path = File.join('/rb/lib', rel)
      FileUtils.mkdir_p File.dirname(path)
      File.write path, src
    end
    $LOAD_PATH.unshift '/rb/lib'
  `);
}

function rubyString(s) {
  // A Ruby single-quoted literal only gives \\ and \' special meaning.
  return "'" + s.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";
}

// The user's code is spliced into a Ruby heredoc, so the delimiter has to be
// something the code cannot contain by accident.
function runnerSource(code) {
  const nonce = 'SANDBOX_' + Math.random().toString(36).slice(2) + '_END';
  return `
begin
  require 'stringio'
  __buf = StringIO.new
  __prev = $stdout
  $stdout = __buf
  begin
    eval(<<'${nonce}', TOPLEVEL_BINDING, '(sandbox)', 1)
${code}
${nonce}
  rescue Exception => e
    __buf.puts "#{e.class}: #{e.message}"
  ensure
    $stdout = __prev
  end
  __buf.string
end
`;
}

function run() {
  if (!vm) return;
  const started = performance.now();
  outputEl.textContent = '';
  try {
    outputEl.textContent = vm.eval(runnerSource(editorEl.value)).toString();
  } catch (e) {
    outputEl.textContent = String(e);
  }
  timingEl.textContent = `${Math.round(performance.now() - started)} ms`;
}

function buildSidebar() {
  let firstButton = null;
  for (const group of examples) {
    const h2 = document.createElement('h2');
    h2.textContent = group.group;
    sidebarEl.append(h2);

    for (const item of group.items) {
      const button = document.createElement('button');
      button.textContent = item.title;
      button.addEventListener('click', () => {
        for (const b of sidebarEl.querySelectorAll('button')) {
          b.removeAttribute('aria-current');
        }
        button.setAttribute('aria-current', 'true');
        editorEl.value = item.code;
        run();
      });
      sidebarEl.append(button);
      firstButton ??= button;
    }
  }
  return firstButton;
}

runEl.addEventListener('click', run);
editorEl.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    run();
  }
});

// ruby.wasm is 40 MB, over the 25 MiB a Cloudflare Pages asset may be and
// most of the bandwidth this page uses, so deployments serve it from R2
// instead and name it in config.json.  Without that file -- a checkout being
// served locally -- it sits next to this page.
async function rubyWasmUrl() {
  try {
    const config = await (await fetch('./config.json', FRESH)).json();
    if (config.rubyWasmUrl) return config.rubyWasmUrl;
  } catch {
    // No config.json, or nothing useful in it.
  }
  return './ruby.wasm';
}

(async () => {
  try {
    detailEl.textContent = '(downloading ruby.wasm — tens of megabytes the first time)';
    const module = await WebAssembly.compileStreaming(fetch(await rubyWasmUrl()));

    detailEl.textContent = '(starting Ruby)';
    ({ vm } = await DefaultRubyVM(module));

    detailEl.textContent = '(loading ActiveRecord and creating the sample data)';
    await installRubyFiles();
    vm.eval(await (await fetch('./boot.rb', FRESH)).text());

    statusEl.hidden = true;
    layoutEl.hidden = false;
    buildSidebar().click();
    editorEl.focus();
  } catch (e) {
    detailEl.textContent = '';
    statusEl.innerHTML = '<strong>Failed to start.</strong><br>';
    statusEl.append(String(e));
  }
})();
</script>

</body>
</html>
