<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>activerecord-refined sandbox</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1b1f24;
    --muted: #5b6470;
    --border: #d8dee6;
    --accent: #b4433a;
    --accent-weak: #fdf2f1;
    --code-bg: #1e232b;
    --code-fg: #e6e9ee;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--fg);
    background: var(--bg);
    line-height: 1.6;
  }

  header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 1rem;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.05rem; margin: 0; }
  header p { margin: 0; color: var(--muted); font-size: .85rem; }
  header a { color: var(--accent); }

  #layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: calc(100vh - 57px);
  }
  /* Same clash as #data-pane below: display here outranks [hidden], so the
     layout would show through while Ruby is still starting. */
  #layout[hidden] { display: none; }

  /* Two panes that scroll apart: the examples are a long list to read
     through, the tables a short one to keep reaching for.  Letting the
     examples push the tables out of view would defeat the point of them. */
  #sidebar {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #examples-nav {
    flex: 1 1 auto;
    overflow-y: auto;
    min-height: 0;
    padding: .75rem 0 1rem;
  }
  /* 0 0 rather than 0 1: shrinking is what makes this pane feel cramped, since
     the examples beside it are always the taller of the two and the shrink
     would come out of both.  It takes the height of its rows, up to half the
     sidebar, and scrolls beyond that. */
  #data-nav {
    flex: 0 0 auto;
    overflow-y: auto;
    min-height: 0;
    max-height: 50%;
    border-top: 1px solid var(--border);
    padding-bottom: 1rem;
  }
  #sidebar h2 {
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin: 1rem 1rem .35rem;
  }
  #sidebar button {
    display: block;
    width: 100%;
    text-align: left;
    padding: .3rem 1rem;
    border: 0;
    background: none;
    font: inherit;
    font-size: .87rem;
    cursor: pointer;
    color: var(--fg);
  }
  #sidebar button:hover { background: var(--accent-weak); }
  #sidebar button[aria-current="true"] {
    background: var(--accent-weak);
    color: var(--accent);
    font-weight: 600;
  }

  #main {
    display: grid;
    grid-template-rows: auto 1fr 1fr;
    min-height: 0;
    padding: 1rem 1.25rem 1.25rem;
    gap: .5rem;
  }

  .bar {
    display: flex;
    align-items: center;
    gap: .75rem;
  }
  .bar h2 { font-size: .8rem; margin: 0; color: var(--muted); font-weight: 600; }
  .bar .spacer { flex: 1; }

  button.run {
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 5px;
    padding: .35rem .9rem;
    font: inherit;
    font-size: .85rem;
    cursor: pointer;
  }
  button.run:disabled { background: #b9c0c9; cursor: default; }
  .hint { color: var(--muted); font-size: .78rem; }

  pre {
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.55;
    margin: 0;
    border-radius: 6px;
    min-height: 0;
  }

  /* CodeMirror brings its own scrolling and its own theme; this only has to
     give it a box to fill and the monospace face the rest of the page uses. */
  #editor {
    min-height: 0;
    overflow: hidden;
    border-radius: 6px;
    font-family: var(--font-mono);
  }
  #editor .cm-editor { height: 100%; }
  #editor .cm-editor.cm-focused { outline: 2px solid var(--accent); outline-offset: -1px; }

  pre {
    background: var(--code-bg);
    color: var(--code-fg);
    padding: .7rem .8rem;
    overflow: auto;
    white-space: pre;
  }

  /* The output pane splits in two when a table is opened beside it, so a query
     and the table it ran against can be read at once.  Each column carries its
     own heading inside the same two-row grid, so the two boxes below start at
     the same line however tall either heading is. */
  #output-split {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
    gap: .5rem;
    min-height: 0;
  }
  #output-split:has(#data-pane:not([hidden])) {
    grid-template-columns: 1fr 1fr;
  }
  #output-split > *, #data-pane > * { min-width: 0; min-height: 0; }

  #output-bar   { grid-column: 1; grid-row: 1; }
  #output       { grid-column: 1; grid-row: 2; }
  #data-bar     { grid-column: 2; grid-row: 1; }
  #data-scroll  { grid-column: 2; grid-row: 2; }

  /* contents so the heading and the table below it are placed by the grid
     above rather than by this element, which is only here to be toggled. */
  #data-pane { display: contents; }
  #data-pane[hidden] { display: none; }

  #data-scroll {
    overflow: auto;
    border-radius: 6px;
    background: var(--code-bg);
  }

  /* Ruby colours its syntax errors; these are the codes it reaches for,
     toned to sit on the output pane's background rather than a terminal's. */
  #output .b { font-weight: 600; }
  #output .u { text-decoration: underline; }
  #output .red     { color: #ff8a80; }
  #output .green   { color: #a5d6a7; }
  #output .yellow  { color: #ffe082; }
  #output .blue    { color: #90caf9; }
  #output .magenta { color: #ce93d8; }
  #output .cyan    { color: #80deea; }
  #output .white   { color: #ffffff; }
  #output .grey    { color: #9aa4b1; }

  #data-close {
    background: none;
    border: 0;
    color: var(--muted);
    font-size: 1.1rem;
    line-height: 1;
    padding: 0 .2rem;
    cursor: pointer;
  }
  #data-close:hover { color: var(--fg); }

  #data-table {
    border-collapse: collapse;
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--code-fg);
    width: 100%;
  }
  #data-table th, #data-table td {
    text-align: left;
    padding: .25rem .6rem;
    white-space: nowrap;
    border-bottom: 1px solid #2c333d;
  }
  #data-table th {
    position: sticky;
    top: 0;
    background: #2a303a;
    font-weight: 600;
  }
  #data-table tr:last-child td { border-bottom: 0; }
  #data-table td.null { color: #7f8a99; font-style: italic; }
  #data-table td.number { text-align: right; }

  #status {
    padding: 2rem 1.25rem;
    color: var(--muted);
    font-size: .9rem;
  }
  #status strong { color: var(--fg); }

  /* Narrow enough that two columns of anything are unreadable, so the whole
     page becomes one column that scrolls.  The nesting is dissolved with
     display: contents and the pieces ordered by hand, which is what lets the
     table list and the table it opens sit at the foot of the page together --
     out of the way until wanted, rather than above the editor. */
  @media (max-width: 800px) {
    #layout {
      grid-template-columns: 1fr;
      height: auto;
      gap: .5rem;
      padding: 1rem 1.25rem 1.25rem;
    }
    #sidebar, #main, #output-split { display: contents; }

    #examples-nav { order: 1; max-height: 220px; padding: 0 0 .5rem; }
    #code-bar     { order: 2; }
    #editor       { order: 3; height: 28vh; }
    #output-bar   { order: 4; }
    #output       { order: 5; height: 34vh; }
    #data-nav     { order: 6; max-height: 220px; padding: .5rem 0; }
    #data-bar     { order: 7; }
    #data-scroll  { order: 8; max-height: 50vh; }

    /* The two-column placement above is for the wide layout only. */
    #output-bar, #output, #data-bar, #data-scroll {
      grid-column: auto;
      grid-row: auto;
    }

    #sidebar h2 { margin-left: 0; margin-right: 0; }
    #sidebar button { padding-left: 0; padding-right: 0; }
    #examples-nav { border: 0; border-bottom: 1px solid var(--border); }
    #data-nav { border: 0; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>

<header>
  <h1>activerecord-refined sandbox</h1>
  <p>
    Ruby 4.1, ActiveRecord and SQLite, running inside your browser.
    <a href="https://github.com/shugo/activerecord-refined" target="_blank" rel="noopener">GitHub</a>
  </p>
</header>

<div id="status">Loading Ruby… <strong id="status-detail"></strong></div>

<div id="layout" hidden>
  <nav id="sidebar">
    <div id="examples-nav"></div>
    <div id="data-nav"></div>
  </nav>

  <div id="main">
    <div class="bar" id="code-bar">
      <h2>Code</h2>
      <div class="spacer"></div>
      <span class="hint">Ctrl/Cmd + Enter to run</span>
      <button class="run" id="run">Run</button>
    </div>
    <div id="editor"></div>

    <div id="output-split">
      <div class="bar" id="output-bar"><h2>Output</h2></div>
      <pre id="output"></pre>
      <section id="data-pane" hidden>
        <div class="bar" id="data-bar">
          <h2 id="data-title"></h2>
          <div class="spacer"></div>
          <span class="hint" id="data-count"></span>
          <button id="data-close" title="Close" aria-label="Close">&times;</button>
        </div>
        <div id="data-scroll"><table id="data-table"></table></div>
      </section>
    </div>
  </div>
</div>

<script src="./assets/browser.umd.js"></script>
<script type="module">
import { examples } from './examples.js';
import { createEditor } from './assets/editor.js';

const { DefaultRubyVM } = globalThis['ruby-wasm-wasi'];

const statusEl = document.getElementById('status');
const detailEl = document.getElementById('status-detail');
const layoutEl = document.getElementById('layout');
const sidebarEl = document.getElementById('sidebar');
const examplesNavEl = document.getElementById('examples-nav');
const dataNavEl = document.getElementById('data-nav');
const editorParentEl = document.getElementById('editor');
let editorEl;
const outputEl = document.getElementById('output');
const runEl = document.getElementById('run');
const dataPaneEl = document.getElementById('data-pane');
const dataTitleEl = document.getElementById('data-title');
const dataCountEl = document.getElementById('data-count');
const dataTableEl = document.getElementById('data-table');
const dataCloseEl = document.getElementById('data-close');
const dataScrollEl = document.getElementById('data-scroll');

let vm;
let openTableName = null;

// These are a few KB each and change with every deployment, while GitHub
// Pages serves them with max-age=600.  A hard reload does not help: it
// bypasses the cache for the document and its subresources, not for what a
// script fetches afterwards.  Revalidating instead costs a 304 when nothing
// has changed.  ruby.wasm is deliberately left out of this -- it is 40 MB,
// and its own cache-control is what governs it.
const FRESH = { cache: 'no-cache' };

// Nothing under rb/lib is packed into ruby.wasm.  The sources are handed to
// Ruby, which writes them into the in-memory filesystem and puts that on
// $LOAD_PATH.  activerecord-refined cannot be packed (the rbwasm output is
// already wasi-vfs packed, and the gem's required_ruby_version keeps Bundler
// on the build host from resolving it), and this way the gem can be swapped
// without rebuilding the 64 MB binary.
async function installRubyFiles() {
  const manifest = await (await fetch('./manifest.json', FRESH)).json();
  const sources = await Promise.all(
    manifest.map(async (rel) => [rel, await (await fetch(`./rb/lib/${rel}`, FRESH)).text()])
  );

  const entries = sources
    .map(([rel, src]) => `[${rubyString(rel)}, ${rubyString(src)}]`)
    .join(',\n');

  vm.eval(`
    require 'fileutils'
    [
      ${entries}
    ].each do |rel, src|
      path = File.join('/rb/lib', rel)
      FileUtils.mkdir_p File.dirname(path)
      File.write path, src
    end
    $LOAD_PATH.unshift '/rb/lib'
  `);
}

function rubyString(s) {
  // A Ruby single-quoted literal only gives \\ and \' special meaning.
  return "'" + s.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";
}

// The user's code is spliced into a Ruby heredoc, so the delimiter has to be
// something the code cannot contain by accident.
function runnerSource(code) {
  const nonce = 'SANDBOX_' + Math.random().toString(36).slice(2) + '_END';
  return `
begin
  require 'stringio'
  __buf = StringIO.new
  __prev = $stdout
  $stdout = __buf
  begin
    eval(<<'${nonce}', TOPLEVEL_BINDING, '(sandbox)', 1)
${code}
${nonce}
  rescue Exception => e
    __buf.puts "#{e.class}: #{e.message}"
  ensure
    $stdout = __prev
  end
  __buf.string
end
`;
}

// Ruby colours its syntax errors, and those escape sequences would otherwise
// be read as text.  Only the SGR codes it actually uses are understood; any
// other sequence is dropped rather than shown.
const SGR = {
  1: 'b', 4: 'u',
  31: 'red', 32: 'green', 33: 'yellow', 34: 'blue',
  35: 'magenta', 36: 'cyan', 37: 'white',
  90: 'grey', 91: 'red', 92: 'green', 93: 'yellow', 94: 'blue',
  95: 'magenta', 96: 'cyan', 97: 'white',
};

function writeAnsi(el, text) {
  el.replaceChildren();
  let classes = [];

  for (const piece of text.split(/(\[[0-9;]*m)/)) {
    const codes = piece.match(/^\[([0-9;]*)m$/);
    if (codes) {
      for (const code of (codes[1] || '0').split(';')) {
        if (code === '' || code === '0') classes = [];
        else if (SGR[code]) classes = [...new Set([...classes, SGR[code]])];
      }
    } else if (piece && classes.length) {
      const span = document.createElement('span');
      span.className = classes.join(' ');
      span.textContent = piece;
      el.append(span);
    } else if (piece) {
      el.append(piece);
    }
  }
}

function evaluate(code) {
  try {
    writeAnsi(outputEl, vm.eval(runnerSource(code)).toString());
  } catch (e) {
    writeAnsi(outputEl, String(e));
  }
}

function run() {
  if (!vm) return;
  evaluate(editorEl.value);
  // What just ran may well have changed the table on display -- creating a row
  // is one of the things you come here to try.
  if (openTableName) openTable(openTableName);
}

// Each pane keeps its own selection: opening a table does not mean you have
// stopped reading the example whose output is still on the left.
function select(button) {
  for (const b of button.parentElement.querySelectorAll('button')) {
    b.removeAttribute('aria-current');
  }
  button.setAttribute('aria-current', 'true');
}

// Shown beside the output rather than in it, so a query and the table it ran
// against can be read together.  The rows are read when the button is pressed;
// pressing it again is the refresh.
function openTable(name) {
  // Reopening the same table is a refresh, so hold the scroll position rather
  // than throwing the reader back to the first row.
  const scrollTop = name === openTableName ? dataScrollEl.scrollTop : 0;

  const json = vm.eval(`
    begin
      data_json(${JSON.stringify(name)})
    rescue => e
      require 'json'
      JSON.generate(error: "#{e.class}: #{e.message}")
    end
  `).toString();

  const { columns, rows, error } = JSON.parse(json);
  dataTitleEl.textContent = name;
  dataTableEl.replaceChildren();

  if (error) {
    dataCountEl.textContent = '';
    dataTableEl.insertRow().insertCell().textContent = error;
  } else {
    const head = dataTableEl.createTHead().insertRow();
    for (const column of columns) {
      const th = document.createElement('th');
      th.textContent = column;
      head.append(th);
    }

    const body = dataTableEl.createTBody();
    for (const row of rows) {
      const tr = body.insertRow();
      for (const value of row) {
        const td = tr.insertCell();
        if (value === null) {
          // Worth seeing as itself: telling NULL from an empty string is half
          // of what the DSL is about.
          td.textContent = 'NULL';
          td.className = 'null';
        } else {
          td.textContent = String(value);
          if (typeof value === 'number') td.className = 'number';
        }
      }
    }
    dataCountEl.textContent = `${rows.length} row(s)`;
  }

  openTableName = name;
  dataPaneEl.hidden = false;
  dataScrollEl.scrollTop = scrollTop;
}

function closeTable() {
  dataPaneEl.hidden = true;
  openTableName = null;
  for (const b of dataNavEl.querySelectorAll('button')) b.removeAttribute('aria-current');
}

function addGroup(pane, title) {
  const h2 = document.createElement('h2');
  h2.textContent = title;
  pane.append(h2);
}

function addButton(pane, label, onClick) {
  const button = document.createElement('button');
  button.textContent = label;
  button.addEventListener('click', () => {
    select(button);
    onClick();
  });
  pane.append(button);
  return button;
}

function buildSidebar(tables) {
  let firstButton = null;

  for (const group of examples) {
    addGroup(examplesNavEl, group.group);
    for (const item of group.items) {
      const button = addButton(examplesNavEl, item.title, () => {
        editorEl.value = item.code;
        run();
      });
      firstButton ??= button;
    }
  }

  // Reading a table leaves the editor alone: it is there to check what the
  // data looks like now, often in the middle of writing something against it.
  // The rows are read when the button is pressed, so they reflect whatever the
  // examples -- or you -- have done to the table since.
  addGroup(dataNavEl, 'Data');
  for (const table of tables) {
    addButton(dataNavEl, table, () => openTable(table));
  }

  return firstButton;
}

runEl.addEventListener('click', run);
dataCloseEl.addEventListener('click', closeTable);

// ruby.wasm is 40 MB, over the 25 MiB a Cloudflare Pages asset may be and
// most of the bandwidth this page uses, so deployments serve it from R2
// instead and name it in config.json.  Without that file -- a checkout being
// served locally -- it sits next to this page.
async function rubyWasmUrl() {
  try {
    const config = await (await fetch('./config.json', FRESH)).json();
    if (config.rubyWasmUrl) return config.rubyWasmUrl;
  } catch {
    // No config.json, or nothing useful in it.
  }
  return './ruby.wasm';
}

(async () => {
  try {
    detailEl.textContent = '(downloading ruby.wasm — tens of megabytes the first time)';
    const module = await WebAssembly.compileStreaming(fetch(await rubyWasmUrl()));

    detailEl.textContent = '(starting Ruby)';
    ({ vm } = await DefaultRubyVM(module));

    detailEl.textContent = '(loading ActiveRecord and creating the sample data)';
    await installRubyFiles();
    vm.eval(await (await fetch('./boot.rb', FRESH)).text());

    // Asked of the schema rather than listed here, so a model added to boot.rb
    // appears under Data on its own.
    const tables = JSON.parse(vm.eval('require "json"; tables.to_json').toString());

    statusEl.hidden = true;
    layoutEl.hidden = false;

    // After the layout is shown, so CodeMirror measures a box that has a size.
    editorEl = createEditor({ parent: editorParentEl, onRun: run });

    buildSidebar(tables).click();
    editorEl.focus();
  } catch (e) {
    detailEl.textContent = '';
    statusEl.innerHTML = '<strong>Failed to start.</strong><br>';
    statusEl.append(String(e));
  }
})();
</script>

</body>
</html>
